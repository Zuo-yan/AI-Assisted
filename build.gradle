plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = mod_version
group = mod_group_id

repositories {
    mavenLocal()
    mavenCentral()
    // CurseMaven：只为 curse.maven 组服务（下方挂到运行环境的测试模组），不拖慢其它依赖的解析
    maven {
        url "https://www.cursemaven.com"
        content { includeGroup "curse.maven" }
    }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(ProcessResources).configureEach {
    filteringCharset = 'UTF-8'
}

tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            // fg.deobf 拉进来的外部模组（暮色森林/家具等）mixin refmap 里仍是 SRG 名，
            // 而 dev 运行时的类是 official 命名——不重映射的话 RF 的 EntityMixin 在应用期
            // 找不到 m_20098_ 这类目标会直接崩。让 mixin 按 SRG→official 映射表现场翻译
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // ===== 测试环境模组（IDEA 的 runClient 会加载；发布 jar 不含它们）=====
    // 暮色森林 1.20.1-4.3.1893
    implementation fg.deobf("curse.maven:the-twilight-forest-227639:4865711")
    // MrCrayfish 家具 Refurbished 1.20.1-1.0.20
    implementation fg.deobf("curse.maven:refurbished-furniture-897116:7110922")
    // 上面家具模组的强制前置（其 mods.toml 要求 framework [0.7.15,)）；缺了 runClient 直接起不来
    implementation fg.deobf("curse.maven:framework-549225:6531428")

    // JUnit 5
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Gson：供 core 的报文处理与单测使用（运行期由 Minecraft 自带）
    testImplementation 'com.google.code.gson:gson:2.14.0'
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}

// 1.20.1 运行时是 SRG 命名：发布 jar 必须经 reobfJar 从 official 再混淆到 SRG
tasks.named('jar') {
    finalizedBy('reobfJar')
}

// 与 26.3 分支同构：mods.toml 以模板 + 属性展开的方式生成，字段只定义在 gradle.properties
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [minecraft_version      : minecraft_version,
                             minecraft_version_range: minecraft_version_range,
                             forge_version          : forge_version,
                             forge_version_range    : forge_version_range,
                             loader_version_range   : loader_version_range,
                             mod_id                 : mod_id,
                             mod_name               : mod_name,
                             mod_license            : mod_license,
                             mod_version            : mod_version,
                             mod_authors            : mod_authors,
                             mod_description        : mod_description]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
